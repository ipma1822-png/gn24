name: Build GN24 article share pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_share_pages.py"
      - ".github/workflows/build-og-share-pages.yml"

permissions:
  contents: write

concurrency:
  group: gn24-og-share-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build article OG share pages from Supabase
        run: python3 scripts/generate_share_pages.py

      - name: Commit generated share pages and sitemap
        run: |
          git config user.name "Global News24 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add share/ sitemap.xml news-sitemap.xml .indexnow-state.json
          if git diff --cached --quiet; then
            echo "No OG share page or sitemap changes."
            exit 0
          fi
          git commit -m "Auto update article share OG pages and sitemap"
          git push

      - name: Notify IndexNow for search-priority articles
        if: success()
        run: |
          if [ ! -s /tmp/gn24-indexnow-urls.txt ]; then
            echo "No new or updated search-priority URLs."
            exit 0
          fi
          echo "Waiting briefly for GitHub Pages to publish the new static article pages..."
          sleep 45
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "IndexNow: $url"
            code=$(curl -sS -o /tmp/indexnow-response.txt -w "%{http_code}" --get "https://searchadvisor.naver.com/indexnow" \
              --data-urlencode "url=$url" \
              --data-urlencode "key=9f3a7c2e6b184d5fa8c1e7b4d2906a31")
            echo "HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "202" ]; then
              cat /tmp/indexnow-response.txt || true
              exit 1
            fi
          done < /tmp/gn24-indexnow-urls.txt

# 2026-09-22: retrigger scheduled share-page generation after scheduler gap
