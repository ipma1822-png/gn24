name: Build GN24 article share pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gn24-og-share-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build article OG share pages from Supabase
        run: python3 scripts/generate_share_pages.py

      - name: Commit generated share pages
        run: |
          git config user.name "Global News24 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add share/
          if git diff --cached --quiet; then
            echo "No OG share page changes."
            exit 0
          fi
          git commit -m "Auto update article share OG pages"
          git push
