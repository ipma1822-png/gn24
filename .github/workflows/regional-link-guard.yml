name: Domestic article navigation guard
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: domestic-link-guard-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regional-links:
    name: Domestic article navigation guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check all domestic navigation sources
        run: |
          python3 scripts/check_regional_links.py
          python3 tests/regional-links/mutations.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        working-directory: tests/regional-links
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests/regional-links
        run: npx playwright install --with-deps chromium --only-shell
      - name: Test 17 editions without any static share HTML
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/gn24-link-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/regional-links/check.cjs
      - name: Wait for this commit's existing Pages deployment
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0] | if . == null then "pending" else (.status + ":" + (.conclusion // "pending")) end')
            if [ "$state" = "completed:success" ]; then exit 0; fi
            if [[ "$state" == completed:* ]]; then echo "Pages deployment failed: $state"; exit 1; fi
            sleep 5
          done
          echo "Pages deployment was not confirmed for $GITHUB_SHA"
          exit 1
      - name: Verify representative live article clicks after Pages deployment
        if: github.event_name != 'pull_request'
        run: node tests/regional-links/check.cjs --live
