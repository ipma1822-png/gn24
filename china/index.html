</style></head><body class="global-edition"><div class="global-edition-shell" id="globalEditionRoot"><header class="global-edition-header"><div class="global-edition-wrap global-edition-mast"><a class="global-edition-brand" href="/" aria-label="GLOBAL NEWS24 首页"><span class="global-edition-mark">GN<span>24</span></span><span><strong>GLOBAL NEWS24</strong><small id="editionName">中国版</small></span></a><div class="global-edition-header-side"><span id="countryName"></span><span id="editionStatus"></span><a class="global-edition-network-link" href="/region/" id="networkTop">全球新闻网络 ↗</a></div></div><nav class="global-edition-nav"><div class="global-edition-wrap global-edition-nav-scroll" id="globalNav"></div></nav></header><main id="globalMain" class="global-edition-wrap"></main><footer class="global-edition-footer"><div class="global-edition-wrap global-edition-footer-inner"><div><strong>GLOBAL NEWS24 · 中国版</strong><p class="gn24-china-publisher" style="margin:12px 0 6px;line-height:1.7"><span style="display:block">GLOBAL HEADQUARTERS · SOUTH KOREA</span><span style="display:block">Founder &amp; Publisher, GLOBAL NEWS24</span><span style="display:block">JEON SEONG KWEON (全成权)</span><span style="display:block" lang="zh-CN">全球新闻24 创始人兼发行人</span></p><p id="footerNotice"></p><small id="footerNetworkStatus"></small></div><a href="/region/" id="networkFooter">全球新闻网络 ↗</a></div></footer></div><script defer src="/assets/js/global-quick-menu.js?v=1.1.0"></script><script defer src="/assets/js/universal-mega-nav.js?v=1.0.0"></script><script>
/* China-only homepage presentation. Existing data, article links and shared renderer remain unchanged. */
(()=>{
 if(new URLSearchParams(location.search).get('view'))return;
 const main=document.getElementById('globalMain');
 if(!main)return;
 const render=()=>{
  if(document.getElementById('gn24CnOverview')||!main.querySelector('.global-edition-lead'))return false;
  const stories=window.GN24_COUNTRY_CONTENT;
  if(!Array.isArray(stories))return false;
  const leadLink=main.querySelector('.global-edition-lead');
  const leadId=new URL(leadLink.href,location.href).searchParams.get('id');
  const chosen=stories.filter(a=>a.id!==leadId).slice(0,12);
  if(!chosen.length)return true;
  const section=document.createElement('section');section.id='gn24CnOverview';
  const title=document.createElement('h2');title.className='gn24-cn-overview-title';title.textContent='🌍 全球新闻速览 · 最新报道';
  const grid=document.createElement('div');grid.className='gn24-cn-overview-grid';
  chosen.forEach(a=>{
   const card=document.createElement('a');card.className='gn24-cn-overview-card';
   card.href='/china/?view=article&id='+encodeURIComponent(a.id);
   const img=document.createElement('img');
   img.loading='lazy';img.alt='';
   img.src=/^https:\/\//i.test(a.image||'')?a.image:'/assets/global-edition/data/fallback.svg';
   img.onerror=()=>{img.onerror=null;img.src='/assets/global-edition/data/fallback.svg'};
   const copy=document.createElement('div');copy.className='gn24-cn-overview-copy';
   const meta=document.createElement('small');meta.textContent=a.scope==='country-local'?'中国新闻':'国际新闻';
   const headline=document.createElement('strong');headline.textContent=a.title;
   const date=document.createElement('time');date.textContent=a.date||'';
   copy.append(meta,headline,date);card.append(img,copy);grid.append(card);
  });
  section.append(title,grid);
  main.querySelector('.global-edition-lead-grid').after(section);
  document.body.classList.add('gn24-china-overview');
  return true;
 };
 const observer=new MutationObserver(()=>{if(render())observer.disconnect()});
 observer.observe(main,{childList:true});
 if(render())observer.disconnect();
})();
</script><script>
/* China edition only: translate universal country switcher without changing links or shared code. */
(()=>{
const names={"china":"中国","japan":"日本","philippines":"菲律宾","indonesia":"印度尼西亚","malaysia":"马来西亚","thailand":"泰国","vietnam":"越南","nepal":"尼泊尔","india":"印度","pakistan":"巴基斯坦","mongolia":"蒙古","iran":"伊朗","uae":"阿联酋","saudi-arabia":"沙特阿拉伯","turkiye":"土耳其","morocco":"摩洛哥","egypt":"埃及","south-africa":"南非","kenya":"肯尼亚","nigeria":"尼日利亚","spain":"西班牙","uk":"英国","france":"法国","germany":"德国","italy":"意大利","russia":"俄罗斯","canada":"加拿大","usa":"美国","mexico":"墨西哥","panama":"巴拿马","cuba":"古巴","brazil":"巴西","argentina":"阿根廷","colombia":"哥伦比亚","australia":"澳大利亚","new-zealand":"新西兰","algeria":"阿尔及利亚","tunisia":"突尼斯","ghana":"加纳","ethiopia":"埃塞俄比亚","netherlands":"荷兰","portugal":"葡萄牙","poland":"波兰","greece":"希腊","georgia":"格鲁吉亚","bangladesh":"孟加拉国","sri-lanka":"斯里兰卡","singapore":"新加坡","iraq":"伊拉克","jordan":"约旦","kazakhstan":"哈萨克斯坦","syria":"叙利亚","costa-rica":"哥斯达黎加","chile":"智利","peru":"秘鲁","uruguay":"乌拉圭","venezuela":"委内瑞拉"};
const continents={"ASIA":"亚洲","MIDDLE EAST":"中东","AFRICA":"非洲","EUROPE":"欧洲","NORTH AMERICA":"北美洲","LATIN AMERICA":"拉丁美洲","SOUTH AMERICA":"南美洲","OCEANIA":"大洋洲","WORLD NETWORK":"全球新闻网络"};
function apply(){
 document.querySelectorAll('.gn24-universal-kicker').forEach(el=>{if(el.textContent.trim()==='GLOBAL NEWS24 NETWORK')el.textContent='GLOBAL NEWS24 · 全球新闻网络'});
 document.querySelectorAll('.gn24-universal-panel .gn24-country-group h3').forEach(el=>{const t=el.textContent.trim();if(continents[t])el.textContent=continents[t]});
 document.querySelectorAll('.gn24-universal-panel .gn24-country-link').forEach(a=>{
  const slug=new URL(a.href,location.href).pathname.split('/').filter(Boolean)[0];
  const span=a.querySelector('span');if(!span||!names[slug])return;
  Array.from(span.childNodes).filter(n=>n.nodeType===Node.TEXT_NODE).forEach(n=>n.textContent=' '+names[slug]);
  const small=a.querySelector('small');if(small)small.textContent='国家版 ↗';
 });
 const status=document.getElementById('editionStatus');if(status)status.textContent=status.textContent.replace(/OPEN/g,'已开通');
}
let pending=false;
new MutationObserver(()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;apply()})}).observe(document.body,{childList:true,subtree:true});
apply();
})();
</script></body></html>
