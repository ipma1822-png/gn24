<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>지역 제보관리 | GLOBAL NEWS24</title><link rel="icon" href="/assets/images/logos/gn24-icon.svg"><style>body{margin:0;background:#f3f6f8;color:#13212d;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 14px 70px}.hero,.bar,.panel,.stat{background:#fff;border:1px solid #dce4ea;border-radius:16px}.hero{padding:24px;background:linear-gradient(135deg,#07101c,#173b59);color:#fff}.hero small{color:#79c9ff;font-weight:900}.hero h1{margin:7px 0}.hero p{color:#d9e5ee}.bar{margin-top:14px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar a,.bar button,.bar select{padding:9px 11px;border:1px solid #cbd5dd;border-radius:10px;background:#fff;text-decoration:none;color:#223746;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{padding:14px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#6d7b86}.panel{margin-top:14px;padding:14px;overflow:auto}.panel h2{margin:0 0 12px}.panel table{width:100%;border-collapse:collapse;min-width:1040px}.panel th,.panel td{padding:9px;border-bottom:1px solid #e8edf1;text-align:left;font-size:13px;vertical-align:top}.panel select,.panel input{padding:7px;border:1px solid #ccd6df;border-radius:8px;max-width:180px}.note{margin-top:14px;padding:13px;border-radius:12px;background:#fff6e8;color:#6e4c1c}.version{text-align:right;color:#89949d;font-size:12px;margin-top:15px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}#detailFields dt{font-weight:800;margin-top:14px}#detailFields dd{margin:5px 0;overflow-wrap:anywhere}#reviewerNotes{width:100%;box-sizing:border-box}button,select,textarea{font:inherit}#saveStatus{padding:10px}button{cursor:pointer}#list tr[data-tip-id]{cursor:pointer;touch-action:manipulation}#list tr[data-tip-id]:hover,#list tr[data-tip-id]:focus{background:#edf6ff}#list td{overflow-wrap:anywhere}#list td:nth-child(4){font-weight:700}@media(max-width:700px){.panel table{min-width:0} .panel th:nth-child(1),.panel td:nth-child(1),.panel th:nth-child(3),.panel td:nth-child(3),.panel th:nth-child(6),.panel td:nth-child(6){display:none}}</style></head><body><main class="wrap"><section class="hero"><small>GLOBAL NEWS24 · HQ ADMIN</small><h1>지역 제보관리</h1><p>지역 제보를 확인하고 검토 상태와 본사 메모를 관리합니다.</p></section><div class="bar"><a href="/admin-news.html">← 온라인 편집국 · 관리자 로그인</a></div><section id="guard" class="bar" role="status">관리자 권한을 확인하고 있습니다.</section><section id="content" hidden><div class="bar"><label>검색 <input id="tipSearch" type="search" placeholder="제목·제보자 검색"></label><label>유형 <select id="typeFilter"><option value="">전체 유형</option></select></label><label>지역 <select id="regionFilter"><option value="">전체 지역</option></select></label><label>상태 <select id="statusFilter"><option value="">전체</option><option value="submitted">신규</option><option value="reviewing">검토중</option><option value="clarification_requested">추가확인</option><option value="accepted">채택</option><option value="published">기사발행</option><option value="rejected">반려</option></select></label><button id="reload" type="button">새로고침</button><span id="count" role="status"></span></div><section class="panel"><h2>제보 목록</h2><table><thead><tr><th>접수일</th><th>지역</th><th>제보자</th><th>제목</th><th>상태</th><th>상세</th></tr></thead><tbody id="list"></tbody></table></section><section id="detail" class="panel" hidden><h2>제보 상세</h2><button id="writeArticle" type="button">기사작성</button><div id="tipMediaPreview" style="display:flex;gap:10px;flex-wrap:wrap"></div><dialog id="tipMediaZoom"><button id="closeTipMediaZoom" type="button">닫기</button><img id="tipMediaZoomImage" alt="제보사진 확대" style="display:block;max-width:85vw;max-height:80vh;object-fit:contain"></dialog><dl id="detailFields"></dl><label>상태 <select id="detailStatus"><option value="submitted">신규</option><option value="reviewing">검토중</option><option value="clarification_requested">추가확인</option><option value="accepted">채택</option><option value="published">기사발행</option><option value="rejected">반려</option></select></label><p><label>본사 메모<textarea id="reviewerNotes" rows="5"></textarea></label></p><button id="saveStatus" type="button">상태·메모 저장</button><p id="saveMessage" role="status" aria-live="polite"></p></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/gn24-supabase-config.js?v=3.22.3"></script><script src="/assets/js/local-tip-media.js?v=2.0.0"></script><script>(()=>{
'use strict';
const cfg=window.GN24_SUPABASE||{},base=String(cfg.url||'').replace(/\/$/,''),key=String(cfg.anonKey||''),$=id=>document.getElementById(id);
const labels={submitted:'신규',reviewing:'검토중',clarification_requested:'추가확인',accepted:'채택',published:'기사발행',rejected:'반려'};
let token='',rows=[],selected=null,regionalRegion='';
const sb=window.supabase.createClient(cfg.url,cfg.anonKey);
async function req(path,opt={}){
 const {data,error}=await sb.auth.getSession();
 if(error)throw error;
 token=data.session?.access_token||'';
 const response=await fetch(base+path,{...opt,headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=minimal'}});
 if(!response.ok)throw Error('HTTP '+response.status);
 return response.status===204?null:response.json();
}
function submissionType(row){return (String(row.source_notes||'').match(/^유형:\s*([^\r\n]*)/m)?.[1]||'').trim();}
function render(){
 const region=regionalRegion||$('regionFilter').value,status=$('statusFilter').value,type=$('typeFilter').value,query=$('tipSearch').value.trim().toLocaleLowerCase('ko-KR');
 const visible=rows.filter(r=>(!region||r.region===region)&&(!status||r.status===status)&&(!type||submissionType(r)===type)&&(!query||(String(r.title||'')+' '+String(r.name||'')).toLocaleLowerCase('ko-KR').includes(query)));
 $('count').textContent=visible.length+'건';$('list').replaceChildren();
 for(const row of visible){
  const tr=document.createElement('tr');
  tr.dataset.tipId=row.id;tr.tabIndex=0;tr.setAttribute('aria-label',(row.title||'제목 없음')+' 상세 확인');
  tr.addEventListener('click',()=>detail(row.id));
  tr.addEventListener('keydown',event=>{if(event.target===tr&&(event.key==='Enter'||event.key===' ')){event.preventDefault();detail(row.id);}});
  for(const value of [row.created_at?new Date(row.created_at).toLocaleString('ko-KR'):'',row.region,row.name,row.title||'제목 없음',labels[row.status]||row.status]){
   const td=document.createElement('td');td.textContent=value||'-';tr.append(td);
  }
  const photoCount=(row.media_urls||[]).filter(value=>window.GN24LocalTipMedia.path(value)).length;
  const photoBadge=document.createElement('small');photoBadge.textContent=' 📷 '+photoCount;photoBadge.setAttribute('aria-label','첨부사진 '+photoCount+'장');tr.children[3].append(photoBadge);
  const td=document.createElement('td'),button=document.createElement('button');
  button.textContent='상세 확인';button.addEventListener('click',event=>{event.stopPropagation();detail(row.id);});td.append(button);tr.append(td);$('list').append(tr);
 }
 if(!visible.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='제보가 없습니다.';tr.append(td);$('list').append(tr);}
}
async function previewMedia(row){
 const box=$('tipMediaPreview');box.replaceChildren();
 const refs=(row.media_urls||[]).filter(value=>window.GN24LocalTipMedia.path(value)).slice(0,10);
 for(const [i,ref] of refs.entries()){
  try{
   const url=await window.GN24LocalTipMedia.signedUrl(sb,ref);if(selected?.id!==row.id)return;
   const button=document.createElement('button'),img=document.createElement('img');
   button.type='button';button.setAttribute('aria-label','제보사진 '+(i+1)+' 확대');
   img.src=url;img.alt='제보사진 '+(i+1);img.style.cssText='width:120px;height:90px;object-fit:contain';button.append(img);
   button.addEventListener('click',async()=>{try{$('tipMediaZoomImage').src=await window.GN24LocalTipMedia.signedUrl(sb,ref);$('tipMediaZoom').showModal();}catch(e){$('saveMessage').textContent='사진을 불러오지 못했습니다.';}});
   box.append(button);
  }catch(e){if(selected?.id!==row.id)return;const note=document.createElement('span');note.textContent='사진 '+(i+1)+' 열람 실패';box.append(note);}
 }
}
$('closeTipMediaZoom').addEventListener('click',()=>{$('tipMediaZoom').close();$('tipMediaZoomImage').removeAttribute('src');});
function detail(id){
 selected=rows.find(r=>r.id===id);if(!selected)return;
 $('detail').hidden=false;$('detailFields').replaceChildren();previewMedia(selected);
 const fields=[['접수일',selected.created_at],['지역',selected.region],['제목',selected.title],['제보내용',selected.facts],['이름',selected.name],['연락처',selected.phone],['추가정보 (구·군 / 유형 / 장소 / 일자 / 이메일)',selected.source_notes],['자료URL',(selected.media_urls||[]).join('\n')],['활동번호',selected.activity_number],['자료 제공 동의',selected.consent_original_work?'동의':'미동의'],['편집 검토 동의',selected.consent_publication_review?'동의':'미동의']];
 for(const [label,value] of fields){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value||'-';dd.style.whiteSpace='pre-wrap';$('detailFields').append(dt,dd);}
 if(selected.linked_article_id){const dt=document.createElement('dt'),dd=document.createElement('dd'),link=document.createElement('a');dt.textContent='발행기사';link.textContent='발행기사 보기';link.href='/pages/article/?id='+encodeURIComponent(selected.linked_article_id);link.target='_blank';link.rel='noopener';dd.append(link);$('detailFields').append(dt,dd);}
 $('detailStatus').value=selected.status;$('reviewerNotes').value=selected.reviewer_notes||'';$('saveMessage').textContent='';
 $('detail').scrollIntoView({behavior:'smooth',block:'start'});
}
async function load(){
 const data=await req('/rest/v1/gn24_participant_submissions?select=id,participant_type,activity_number,name,phone,region,title,facts,source_notes,media_urls,consent_original_work,consent_publication_review,status,reviewer_notes,linked_article_id,created_at&order=created_at.desc'+(regionalRegion?'&region=eq.'+encodeURIComponent(regionalRegion):''));
 rows=data||[];
 if(regionalRegion){$('regionFilter').replaceChildren(new Option(regionalRegion+' · 담당 지역',regionalRegion));$('regionFilter').value=regionalRegion;$('regionFilter').disabled=true;}
 else{const previous=$('regionFilter').value;$('regionFilter').replaceChildren(new Option('전체 지역',''),...Array.from(new Set(rows.map(r=>r.region).filter(Boolean))).sort().map(region=>new Option(region,region)));if(Array.from($('regionFilter').options).some(o=>o.value===previous))$('regionFilter').value=previous;}
 const previousType=$('typeFilter').value;
 $('typeFilter').replaceChildren(new Option('전체 유형',''),...Array.from(new Set(rows.map(submissionType).filter(Boolean))).sort().map(type=>new Option(type,type)));
 if(Array.from($('typeFilter').options).some(o=>o.value===previousType))$('typeFilter').value=previousType;
 render();
}
$('writeArticle').addEventListener('click',()=>{
 if(!selected)return;
 const notes=String(selected.source_notes||'').split(/\r?\n/);
 const codeLine=notes.find(line=>line.startsWith('지역코드: '))||'';
 const regionCode=codeLine.slice('지역코드: '.length).trim();
 const reference=notes.filter(line=>/^(구·군|유형|장소|일자): /.test(line)).join('\n');
 try{
 sessionStorage.setItem('gn24-local-tip-editor-bridge',JSON.stringify({submissionId:selected.id,title:selected.title||'',facts:selected.facts||'',region_code:regionCode,reference,media_urls:(selected.media_urls||[]).filter(value=>window.GN24LocalTipMedia.path(value)).slice(0,10)}));
 location.href='/admin-news.html?localTip=1';
 }catch(e){$('saveMessage').textContent='기사 초안을 전달하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.';}
});
$('saveStatus').addEventListener('click',async()=>{
 if(!selected)return;const button=$('saveStatus'),id=selected.id,status=$('detailStatus').value,notes=$('reviewerNotes').value.trim();
 if(!Object.hasOwn(labels,status))return;
 button.disabled=true;$('saveMessage').textContent='저장 중…';
 try{await req('/rest/v1/gn24_participant_submissions?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status,reviewer_notes:notes,updated_at:new Date().toISOString()})});await load();detail(id);$('saveMessage').textContent='저장되었습니다.';}
 catch(e){$('saveMessage').textContent='저장하지 못했습니다. 관리자 권한과 세션을 확인해 주세요.';}finally{button.disabled=false;}
});
$('tipSearch').addEventListener('input',render);$('typeFilter').addEventListener('change',render);
$('regionFilter').addEventListener('change',render);$('statusFilter').addEventListener('change',render);
$('reload').addEventListener('click',()=>load().catch(()=>{$('count').textContent='조회 실패 — 세션과 권한을 확인해 주세요.';}));
(async()=>{
 const {data,error}=await sb.auth.getSession();
 token=error?'':data.session?.access_token||'';
 if(!token){$('guard').textContent='온라인 편집국에서 관리자 로그인 후 이용해 주세요.';return;}
 try{
 if(await req('/rest/v1/rpc/is_gn24_admin',{method:'POST',body:'{}'})!==true){
  const scopes=await req('/rest/v1/rpc/gn24_my_regional_scope',{method:'POST',body:'{}'});
  const scope=Array.isArray(scopes)?scopes[0]:scopes;
  if(scope?.scope_type!=='regional_hq'||!scope.regional_hq_code){$('guard').textContent='본사 관리자 또는 시·도본부장만 이용할 수 있습니다.';return;}
  const headquarters=await req('/rest/v1/gn24_regional_headquarters?select=region_name&code=eq.'+encodeURIComponent(scope.regional_hq_code)+'&limit=1');
  regionalRegion=headquarters?.[0]?.region_name||'';
  if(!regionalRegion){$('guard').textContent='담당 지역을 확인할 수 없습니다.';return;}
 }
 await load();$('guard').hidden=true;$('content').hidden=false;
 }catch(e){$('guard').textContent='권한 확인 또는 제보 조회에 실패했습니다. 온라인 편집국에서 다시 로그인해 주세요.';}
})();
})();</script></body></html>
