<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>기사 작성 | Global News24</title><link rel="icon" href="/assets/images/logos/gn24-icon.svg"><link rel="stylesheet" href="/assets/css/style.css?v=3.4.10"><style>body{margin:0;background:#f3f6f8;color:#13212d;font-family:system-ui,-apple-system,sans-serif}.cp{max-width:980px;margin:auto;padding:18px 14px 90px}.hero{padding:23px;border-radius:22px;background:#07101c;color:#fff}.hero small{color:#79c9ff;font-weight:900}.bar,.card,.editor,.notice{margin-top:14px;background:#fff;border:1px solid #dce4ea;border-radius:16px;padding:14px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar a,.bar button{border:1px solid #cbd5dd;border-radius:999px;padding:10px 13px;background:#fff;color:#223746;text-decoration:none;font-weight:900}.bar a.final{background:#8d2020;color:#fff}.meta{font-size:12px;color:#75828c}.notice.ok{background:#edf8ef}.notice.warn{background:#fff4df}.raw{padding:13px;border-radius:12px;background:#f7f9fb;line-height:1.7;white-space:pre-wrap}.rawgrid,.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rawbox{padding:11px;border-radius:11px;background:#f7f9fb}.media{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.media img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px}.media figure{margin:0}.photo-zone,.wide{grid-column:1/-1}.photo-zone{padding:14px;border:1px solid #b9d7c4;border-radius:14px;background:#f3fbf6}.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.photo-pick{display:block;text-align:center;padding:15px;border-radius:14px;background:#0b5d37;color:#fff;font-weight:950}.photo-pick.album{background:#173b59}.photo-pick input{display:none}.editor label{display:block;font-size:12px;font-weight:900}.editor input,.editor textarea{width:100%;box-sizi 보기 주소는 30분 후 만료됩니다.</p><div id="mediaBox" class="media"></div><div class="photo-actions"><label class="photo-pick">📷 사진 촬영<input id="cameraPhoto" type="file" accept="image/*" capture="environment"></label><label class="photo-pick album">🖼️ 앨범 선택<input id="albumPhoto" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></div><div id="photoMessage" class="notice" hidden></div></div><label class="wide">사진 설명<input id="eCaption"></label></div><div id="freeCheck" class="notice"></div><div id="editorMessage" class="notice" hidden></div><div class="sticky"><button id="saveEditor" type="button">저장</button></div></section></section><div class="version">GLOBAL NEWS24 AI NEWSROOM · SIGNED MEDIA ACCESS · v3.12.25</div></main><script src="/assets/js/gn24-supabase-config.js?v=3.2.11"></script><script src="/assets/js/gn24-reporter-auth.js?v=3.12.10"></script><script src="/assets/js/editorial-compare.js?v=3.12.25"></script><script>document.addEventListener('DOMContentLoaded',()=>{const a=document.getElementById('finalAdminLink'),id=new URLSearchParams(location.search).get('id')||'';if(a)a.href='/pages/admin-final-publish/?id='+encodeURIComponent(id)});</script></body></html>
