<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>GN24 DAILY RECORD 관리</title><link rel="stylesheet" href="/assets/css/daily-record-admin.css?v=1.0.0"></head><body><main class="wrap"><section class="hero"><small>GLOBAL NEWS24 · HQ CONTROL</small><h1>GN24 DAILY RECORD</h1><p>오늘의 뉴스가 내일의 역사가 됩니다.</p></section><section id="guard" class="panel status">본사 관리자 권한을 확인하고 있습니다.</section><div id="app" hidden><section class="panel"><div class="bar"><label>기록일 <input id="recordDate" type="date"></label><span id="recordStatus" class="status">DRAFT</span><button id="loadDate" class="btn">불러오기</button><button id="recount" class="btn">↻ 다시 집계</button><button id="lock" class="btn">🔒 기록 잠금</button></div></section><section class="panel"><h2>TODAY AT A GLANCE</h2><div id="metrics" class="metrics"></div><div id="unknown"></div></section><div class="two"><section class="panel"><h2>GLOBAL EDITIONS TODAY</h2><div id="countries" class="list"></div><a href="/region/#global-editions" target="_blank">전체 Edition 보기 ↗</a></section><section class="panel"><h2>KOREA REGIONS TODAY</h2><div id="regions" class="list"></div></section></div><section class="panel"><h2>기본 기록</h2><div class="field"><label>대표 제목</label><input id="headline" placeholder="오늘의 기록"></div><div class="field"><label>요약</label><textarea id="summary" rows="3"></textarea></div><div class="field"><label>오늘의 사진 URL</label><input id="heroImage" placeholder="기사 이미지 URL 또는 직접 업로드"><input id="photoFile" type="file" accept="image/*"></div></section><section class="panel"><h2>TODAY'S EVENTS</h2><div id="events"></div><div class="two"><div><div class="field"><label>TYPE</label><select id="eventType"><option>NEWS</option><option>EDITION</option><option>REGION</option><option>NETWORK</option><option>ORGANIZATION</option><option>PARTNERSHIP</option><option>AWARD</option><option>MILESTONE</option><option>SPECIAL</option></select></div><div class="field"><label>TITLE</label><input id="eventTitle"></div><div class="field"><label>DESCRIPTION</label><textarea id="eventDescription" rows="3"></textarea></div></div><div><div class="field"><label>중요도</label><select id="importance"><option value="NORMAL">일반기록</option><option value="IMPORTANT">◆ MILESTONE</option><option value="HISTORIC">★ HISTORY 후보</option></select></div><div class="field"><label>SOURCE URL</label><input id="sourceUrl" type="url"></div><button id="addEvent" class="btn primary">사건 추가</button></div></div></section><section class="panel"><h2>DEVELOPMENT RECORD</h2><div class="field"><label>제목</label><input id="devTitle"></div><div class="field"><label>문제</label><textarea id="problem" rows="2"></textarea></div><div class="field"><label>조치</label><textarea id="actionTaken" rows="2"></textarea></div><div class="field"><label>결과</label><textarea id="result" rows="2"></textarea></div><button id="addDevelopment" class="btn primary">개발 기록 추가</button></section><section class="panel"><h2>PUBLISHER'S NOTE</h2><div class="field"><textarea id="publisherNote" rows="5" placeholder="공란이어도 확정할 수 있습니다."></textarea></div></section><section class="panel"><h2>NEXT ACTION · 관리자 전용</h2><div class="field"><textarea id="nextAction" rows="4" placeholder="내일 이어갈 일"></textarea></div><div id="previousAction" class="status" hidden></div><button id="saveDraft" class="btn primary">임시저장</button></section></div></main><footer id="sticky" class="sticky" hidden><button id="preview" class="btn">미리보기</button><button id="publish" class="btn gold">오늘 기록 확정</button></footer><div id="previewModal" class="preview hide"><article><button id="closePreview" class="btn preview-close">닫기</button><div id="previewBody"></div></article></div><script src="/assets/js/gn24-supabase-config.js?v=3.24.0"></script><script src="/assets/js/daily-record-admin.js?v=1.0.0"></script></body></html>
