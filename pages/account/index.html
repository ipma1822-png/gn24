atus">로그인 상태를 확인하고 있습니다.</div><div id="signed" hidden><button id="goToday" class="btn" style="width:100%">나의 오늘 기록하기</button><button id="logout" class="btn logout" style="width:100%;margin-top:8px">로그아웃</button></div><div id="auth" hidden><p class="easy">복잡한 회원가입 없이 간편하게 시작하세요.</p><button id="kakaoLogin" class="kakao" type="button">카카오로 시작하기</button><div class="divider">또는</div><button id="emailToggle" class="email-toggle" type="button" aria-expanded="false">이메일로 로그인 · 회원가입</button><div id="emailArea" class="email-area" hidden><div class="tabs"><button id="loginTab" class="on" type="button">로그인</button><button id="signupTab" type="button">회원가입</button></div><form id="form"><div class="field"><label>이메일</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><button id="submit" class="btn" type="submit" style="width:100%">로그인</button></form><p class="fine">이메일 방식은 보조 로그인 수단입니다. 기자·본사 관리자 권한과 일반회원 계정은 별도의 권한체계로 관리됩니다.</p></div></div></section></main><script src="/assets/js/gn24-supabase-config.js?v=3.21.4"></script><script src="/assets/js/gn24-reader-auth.js?v=3.21.7"></script></body></html>
