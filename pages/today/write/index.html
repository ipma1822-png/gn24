<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>나의 오늘 기록하기 | GN24 TODAY</title><link rel="icon" href="/assets/images/logos/gn24-icon.svg"><style>body{margin:0;background:#f5f6f7;color:#17212b;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 14px 70px}.hero,.box{background:#fff;border:1px solid #dfe5e9;border-radius:18px;padding:20px;margin-bottom:14px}.hero{background:#0b1723;color:#fff}.hero small{font-weight:900;color:#76c8ff}.hero h1{margin:8px 0}.hero p{margin:0;color:#d7e1e8}.field{display:grid;gap:7px;margin:15px 0}.field label{font-weight:900}.field input,.field select,.field textarea{box-sizing:border-box;width:100%;border:1px solid #cfd8df;border-radius:12px;padding:13px;font:inherit;background:#fff}.field textarea{min-height:150px;resize:vertical}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:#0c68b5;color:#fff;font-weight:900;font-size:16px}.btn:disabled{opacity:.5}.status{padding:12px;border-radius:10px;background:#eef5fa;line-height:1.55}.fine{font-size:12px;color:#687783;line-height:1.6}</style></head><body><main class="wrap"><section class="hero"><small>GN24 TODAY · 사람들의 오늘</small><h1>나의 오늘 기록하기</h1><p>평범한 하루도 기록하면 역사가 됩니다.</p></section><section class="box"><div id="guard" class="status">로그인 상태를 확인하고 있습니다.</div><form id="form" hidden><div class="field"><label for="name">표시 이름</label><input id="name" maxlength="40" required placeholder="공개될 이름 또는 활동명"></div><div class="field"><label for="region">지역</label><select id="region" required><option value="">지역 선택</option><option value="seoul">서울</option><option value="busan">부산</option><option value="daegu">대구</option><option value="incheon">인천</option><option value="gwangju">광주</option><option value="daejeon">대전</option><option value="ulsan">울산</option><option value="sejong">세종</option><option value="gyeonggi">경기</option><option value="gangwon">강원</option><option value="chungbuk">충북</option><option value="chungnam">충남</option><option value="jeonbuk">전북</option><option value="jeonnam">전남</option><option value="gyeongbuk">경북</option><option value="gyeongnam">경남</option><option value="jeju">제주</option></select></div><div class="field"><label for="category">종류</label><select id="category"><option value="daily">일상</option><option value="community">우리동네</option><option value="celebration">축하</option><option value="wedding">결혼</option><option value="new_start">새로운 시작</option><option value="event">행사</option><option value="service">봉사·나눔</option><option value="honor">수상·성취</option><option value="memorial">부고·추모</option><option value="other">기타</option></select></div><div class="field"><label for="body">오늘의 이야기</label><textarea id="body" maxlength="1200" required placeholder="오늘 있었던 일을 편하게 적어 주세요."></textarea></div><div class="field"><label for="image">사진 주소 <span class="fine">(선택 · 사진 직접 업로드는 다음 단계에서 연결)</span></label><input id="image" type="url" placeholder="https://..."></div><p class="fine">등록한 내용은 바로 공개되지 않습니다. 현재 시범운영 기간에는 GLOBAL NEWS24 본사 검토 후 공개됩니다. 광고·판매성 내용은 TODAY가 아닌 광고 영역으로 분류될 수 있습니다.</p><button id="submit" class="btn" type="submit">본사 검토 요청하기</button></form></section></main><script src="/assets/js/gn24-supabase-config.js?v=3.21.2"></script><script src="/assets/js/gn24-today-write.js?v=3.21.3"></script></body></html>
