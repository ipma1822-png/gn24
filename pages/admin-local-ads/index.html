<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>지역상생광고 | GN24</title><link rel="stylesheet" href="/assets/css/admin-news.css?v=3.23.3"><style>
.local-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.local-form label{display:grid;gap:6px}.local-form input,.local-form select,.local-form textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}.local-wide{grid-column:1/-1}.local-preview{display:flex;flex-wrap:wrap;gap:8px}.local-preview img{width:110px;height:80px;object-fit:contain}.local-item{display:flex;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid #ddd}@media(max-width:600px){.local-form{grid-template-columns:1fr}}
</style></head><body><header class="admin-header"><div class="admin-wrap header-inner"><b>지역상생광고</b><a class="btn" href="/admin-news.html">기사 편집실 · 관리자 로그인</a></div></header><main class="admin-wrap admin-main"><p id="authStatus" role="status">관리자 인증 확인 중…</p><section id="localAdmin" hidden><form id="localForm" class="cardbox local-form">
<input id="adId" type="hidden"><label>지역<select id="region"><option value="seoul">서울</option><option value="busan">부산</option><option value="daegu">대구</option><option value="incheon">인천</option><option value="gwangju">광주</option><option value="daejeon">대전</option><option value="ulsan">울산</option><option value="sejong">세종</option><option value="gyeonggi">경기</option><option value="gangwon">강원</option><option value="chungbuk">충북</option><option value="chungnam">충남</option><option value="jeonbuk">전북</option><option value="jeonnam">전남</option><option value="gyeongbuk">경북</option><option value="gyeongnam">경남</option><option value="jeju">제주</option></select></label><label>업체명<input id="business" maxlength="120" required></label>
<label>클릭 방식<select id="mode"><option>POPUP</option><option>LINK</option></select></label><label>게시상태<select id="published"><option value="false">비공개</option><option value="true">게시</option></select></label>
<label>대표이미지<input id="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label>상세사진 (최대 12장)<input id="photos" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif"></label>
<div id="photoPreview" class="local-preview local-wide"></div><p class="local-wide">이미지는 원본 그대로 저장됩니다. 편집 시 새 파일을 선택하지 않으면 기존 사진을 유지합니다. 상세사진 선택 시 기존 상세사진을 교체합니다.</p>
<label class="local-wide">소개<textarea id="intro" rows="5" maxlength="10000"></textarea></label><label>연락처<input id="phone" maxlength="100"></label><label>주소<input id="address" maxlength="500"></label><label class="local-wide">링크 (LINK 방식 필수)<input id="target" type="url" placeholder="https://"></label>
<label>시작일시 (한국시간)<input id="starts" type="datetime-local" required></label><label>종료일시 (선택)<input id="ends" type="datetime-local"></label>
<div class="local-wide"><button class="btn primary" id="save" type="submit">저장</button> <button class="btn" id="newAd" type="button">신규 광고</button><p id="saveStatus" role="status"></p></div></form><h2>등록 광고</h2><div id="adList" class="cardbox"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/gn24-supabase-config.js?v=3.22.3"></script><script src="/assets/js/local-ads-admin.js?v=1"></script></body></html>
