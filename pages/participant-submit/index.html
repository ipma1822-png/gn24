<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>무료 참여기자 제보 | Global News24</title><link rel="icon" href="/assets/images/logos/gn24-icon.svg"><link rel="stylesheet" href="/assets/css/style.css?v=3.4.10"><style>body{margin:0;background:#f4f7f9;color:#13212d;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 14px 70px}.hero,.card{background:#fff;border:1px solid #dce4ea;border-radius:18px}.hero{padding:26px;background:linear-gradient(135deg,#07101c,#194462);color:#fff}.hero small{color:#78c9ff;font-weight:900}.hero h1{margin:8px 0}.hero p{color:#d9e5ee;line-height:1.7}.card{margin-top:14px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f{display:flex;flex-direction:column;gap:6px}.f.full{grid-column:1/-1}.f label{font-weight:800}.f input,.f select,.f textarea{padding:12px;border:1px solid #ccd6df;border-radius:10px;font:inherit}.f textarea{min-height:120px}.consent{display:flex;gap:9px;margin-top:12px;align-items:flex-start}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions button,.actions a{padding:12px 16px;border-radius:999px;border:0;font-weight:900;text-decoration:none}.actions button{background:#07101c;color:#fff}.actions a{background:#eaf0f4;color:#20313f}.msg{margin-top:12px;padding:12px;border-radius:10px;background:#eef7ff}.note{margin-top:14px;padding:13px;border-radius:12px;background:#fff6e8;color:#6e4c1c;line-height:1.6}.version{text-align:right;color:#8b97a1;font-size:12px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}.f.full{grid-column:auto}}</style></head><body><main class="wrap"><section class="hero"><small>GLOBAL NEWS24 · FREE PARTICIPATION</small><h1>무료 참여기자 제보</h1><p>시민기자·청소년기자·어린이기자가 현장의 사실과 사진·출처를 본사에 전달하는 제보창구입니다. 최종 기사 작성·수정·발행은 본사 편집국이 담당합니다.</p></section><form id="form" class="card"><div class="grid"><div class="f"><label>참여 구분 *</label><select id="participant_type" required><option value="">선택</option><option value="citizen">시민기자</option><option value="youth">청소년기자</option><option value="junior">어린이기자</option></select></div><div class="f"><label>활동번호 *</label><input id="activity_number" required maxlength="40" placeholder="예: GN24-CIT-2026-00001"></div><div class="f"><label>이름 *</label><input id="name" required minlength="2" maxlength="80"></div><div class="f"><label>연락처</label><input id="phone" type="tel" maxlength="30"></div><div class="f"><label>지역</label><input id="region" maxlength="120"></div><div class="f"><label>제보 제목</label><input id="title" maxlength="200" placeholder="무슨 일이 있었나요?"></div><div class="f full"><label>확인한 사실 *</label><textarea id="facts" required minlength="20" maxlength="6000" placeholder="언제, 어디서, 누가, 무엇을, 어떻게 했는지 확인한 사실만 적어 주세요."></textarea></div><div class="f full"><label>출처·추가 설명</label><textarea id="source_notes" maxlength="3000" placeholder="사진 출처, 관계자 설명, 확인이 필요한 부분 등을 적어 주세요."></textarea></div><div class="f full"><label>사진·영상 링크</label><input id="media_urls" maxlength="2000" placeholder="여러 링크는 줄바꿈 또는 쉼표로 구분"></div></div><label class="consent"><input id="consent_original_work" type="checkbox" required>직접 확인한 사실 또는 출처를 명확히 밝힌 자료만 제출합니다.</label><label class="consent"><input id="consent_publication_review" type="checkbox" required>본사에서 사실확인·편집·제목수정·보류·반려할 수 있음을 확인합니다.</label><div id="msg" class="msg" hidden></div><div class="actions"><button type="submit">본사로 제보 보내기</button><a href="/pages/participant-apply/">무료 참여 신청</a></div></form><div class="note">활동번호는 공식 활동 식별번호이며 로그인 비밀번호나 신분증 대용이 아닙니다. 본사는 필요할 경우 연락처와 신청기록을 별도로 확인합니다.</div><div class="version">GLOBAL NEWS24 · FREE PARTICIPATION SUBMISSION · v3.13.6</div></main><script src="/assets/js/gn24-supabase-config.js?v=3.13.4"></script><script src="/assets/js/participant-submit.js?v=3.13.6"></script></body></html>
