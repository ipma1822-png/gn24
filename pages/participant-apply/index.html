<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>무료 참여기자 신청 | Global News24</title><link rel="icon" href="/assets/images/logos/gn24-icon.svg"><link rel="stylesheet" href="/assets/css/style.css?v=3.4.10"><style>body{margin:0;background:#f4f7f9;color:#13212d;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 14px 70px}.hero,.card{background:#fff;border:1px solid #dce4ea;border-radius:18px}.hero{padding:26px;background:linear-gradient(135deg,#07101c,#194462);color:#fff}.hero small{color:#78c9ff;font-weight:900}.hero h1{margin:8px 0}.hero p{color:#d9e5ee;line-height:1.7}.card{margin-top:14px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f{display:flex;flex-direction:column;gap:6px}.f.full{grid-column:1/-1}.f label{font-weight:800}.f input,.f select,.f textarea{padding:12px;border:1px solid #ccd6df;border-radius:10px;font:inherit}.f textarea{min-height:100px}.guardians{padding:14px;background:#fff8e8;border-radius:12px;margin-top:14px}.consent{display:flex;gap:9px;margin-top:12px;align-items:flex-start}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions button,.actions a{padding:12px 16px;border-radius:999px;border:0;font-weight:900;text-decoration:none}.actions button{background:#07101c;color:#fff}.actions a{background:#eaf0f4;color:#20313f}.msg{margin-top:12px;padding:12px;border-radius:10px;background:#eef7ff}.version{text-align:right;color:#8b97a1;font-size:12px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}.f.full{grid-column:auto}}</style></head><body><main class="wrap"><section class="hero"><small>GLOBAL NEWS24 · FREE PARTICIPATION</small><h1>시민기자 · 청소년기자 · 어린이기자</h1><p>운영분담금 없이 참여합니다. 신청 후 본사 심사를 거쳐 승인되면 공식 활동번호를 부여받고, 지역의 좋은 이야기와 공익·교육 현장을 제보할 수 있습니다.</p></section><form id="form" class="card"><div class="grid"><div class="f"><label>참여 구분 *</label><select id="participant_type" required><option value="">선택</option><option value="citizen">시민기자</option><option value="youth">청소년기자</option><option value="junior">어린이기자</option></select></div><div class="f"><label>이름 *</label><input id="name" required minlength="2" maxlength="80"></div><div class="f"><label>출생연도</label><input id="birth_year" type="number" min="1900" max="2100"></div><div class="f"><label>휴대전화</label><input id="phone" type="tel" maxlength="30"></div><div class="f"><label>이메일</label><input id="email" type="email" maxlength="160"></div><div class="f"><label>활동지역</label><input id="region" maxlength="120" placeholder="예: 울산 남구"></div><div class="f full"><label>관심분야</label><input id="interest" maxlength="300" placeholder="예: 학교, 봉사, 안전, 스포츠"></div><div class="f full"><label>자기소개·참여동기</label><textarea id="introduction" maxlength="3000"></textarea></div></div><div id="guardians" class="guardians" hidden><b>미성년 참여자 보호자 확인</b><div class="grid" style="margin-top:10px"><div class="f"><label>보호자 성명 *</label><input id="guardian_name"></div><div class="f"><label>보호자 연락처 *</label><input id="guardian_phone" type="tel"></div></div><label class="consent"><input id="guardian_consent" type="checkbox">보호자가 GLOBAL NEWS24 무료 참여기자 활동에 동의합니다.</label></div><label class="consent"><input id="consent_privacy" type="checkbox" required>신청 심사와 연락을 위한 개인정보 수집·이용에 동의합니다.</label><label class="consent"><input id="consent_activity_rules" type="checkbox" required>사실 확인, 안전, 본사 최종편집·발행 원칙 등 참여활동 규정을 준수합니다.</label><div id="msg" class="msg" hidden></div><div class="actions"><button type="submit">무료 참여 신청</button><a href="/pages/participant-submit/">승인 후 제보하기</a><a href="/pages/reporter-recruit/">기자 모집 안내</a></div></form><div class="version">GLOBAL NEWS24 · FREE PARTICIPATION · v3.13.6</div></main><script src="/assets/js/gn24-supabase-config.js?v=3.13.4"></script><script src="/assets/js/participant-apply.js?v=3.13.6"></script></body></html>
