<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기사 등록 도우미 | Global News24</title><link rel="stylesheet" href="../../assets/css/style.css?v=3.1.7"><style>.builder{max-width:900px;margin:34px auto}.builder label{display:block;font-weight:700;margin:14px 0 6px}.builder input,.builder select,.builder textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:8px;background:#fff}.builder textarea{min-height:120px}.builder .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.builder pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#f9fafb;padding:18px;border-radius:10px;min-height:180px}.builder .actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}@media(max-width:700px){.builder .row{grid-template-columns:1fr}}</style></head><body><main class="wrap builder"><a class="btn btn-outline" href="./">← 운영메뉴얼</a><h1>기사 등록 도우미</h1><p class="muted">서버에 직접 저장하지 않는 안전한 1단계 도구입니다. 작성 후 생성된 JSON을 <code>data/news.json</code>에 추가하면 됩니다.</p><div class="row"><div><label>기사 ID</label><input id="id" placeholder="gn24-20260819-011"></div><div><label>날짜</label><input id="date" type="date" value="2026-08-19"></div></div><label>제목</label><input id="title"><label>부제목</label><input id="subtitle"><div class="row"><div><label>카테고리</label><select id="category"><option>국내소식</option><option>국제뉴스</option><option>경제</option><option>사회</option><option>청소년·문화</option><option>무도·스포츠</option><option>안전·구조</option><option>AI·혁신기술</option><option>공익</option><option>오피니언</option><option>공지</option></select></div><div><label>작성자</label><input id="author" value="Global News24 편집부"></div></div><label>요약</label><textarea id="summary"></textarea><label>대표 이미지 경로</label><input id="image" value="/assets/images/news/gn24-default-news.svg"><label>본문</label><textarea id="content" placeholder="문단과 문단 사이에 빈 줄을 넣어 주세요."></textarea><div class="row"><div><label>출처명</label><input id="sourceName" value="Global News24"></div><div><label>출처 URL</label><input id="sourceUrl"></div></div><label>태그</label><input id="tags" placeholder="태그1, 태그2, 태그3"><div class="actions"><button class="btn" id="make" type="button">기사 JSON 생성</button><button class="btn btn-outline" id="copy" type="button">JSON 복사</button></div><pre id="out">입력 후 ‘기사 JSON 생성’을 누르세요.</pre></main><script>const $=id=>document.getElementById(id);function val(id){return $(id).value.trim()}function build(){const obj={id:val('id'),title:val('title'),subtitle:val('subtitle'),date:val('date'),category:val('category'),summary:val('summary'),image:val('image')||'/assets/images/news/gn24-default-news.svg',author:val('author')||'Global News24 편집부',sourceName:val('sourceName')||'Global News24',sourceUrl:val('sourceUrl'),tags:val('tags').split(',').map(x=>x.trim()).filter(Boolean),content:val('content').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean),featured:false,visualStyle:'normal',pinned:false,relatedOrgs:[]};$('out').textContent=JSON.stringify(obj,null,2)}$('make').onclick=build;$('copy').onclick=async()=>{if($('out').textContent.startsWith('입력 후'))build();await navigator.clipboard.writeText($('out').textContent);$('copy').textContent='복사 완료';setTimeout(()=>$('copy').textContent='JSON 복사',1200)}</script></body></html>
