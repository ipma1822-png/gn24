<h1>코스피, 장중 7,000선 다시 넘었다…AI·반도체 기대에 한국 증시 상승</h1>
<p>코스피가 21일 장 초반 상승하며 한때 7,000선을 다시 넘어섰다. 외국인과 기관이 동반 순매수에 나선 가운데 삼성전자가 3%대 강세를 보이며 지수 상승을 이끌었다. 미국 반도체주 상승과 AI·반도체 산업에 대한 기대가 투자심리에 긍정적으로 작용하고 있지만, 추석 연휴를 앞둔 차익실현 가능성과 미국 물가 지표, 마이크론 실적 등은 향후 시장 흐름을 좌우할 주요 변수로 꼽힌다.</p>
