<h1>태권도와 검도의 새로운 만남…‘태권검도’는 어떻게 시작됐나</h1>
<p>태권도의 발차기와 역동적인 움직임에 검을 활용한 수련체계를 접목한 ‘태권검도’가 새로운 무도문화와 교육 프로그램으로 영역을 넓혀가고 있다. 태권검도는 2009년 전성권 창시자가 처음 발표한 이후 대한태권검도협회를 시작으로 세계태권검도연맹으로 발전하며 수련체계와 교육 콘텐츠를 구축해 왔다. 태권도장에서 검을 수련한다는 것 자체가 생소했던 시절 시작된 태권검도의 탄생과 성장 과정을 살펴본다.</p>
