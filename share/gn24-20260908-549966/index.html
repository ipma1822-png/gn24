<h1>충북도, 지역기업 공공시장 진입 넓힌다… 지역업체 우선계약 강화</h1>
<p>충청북도가 지역기업의 공공계약 참여 기회를 확대하고 지역경제 활성화를 위한 계약정책을 강화한다. 연간 발주계획과 주요 사업 정보를 사전에 공개해 지역업체가 입찰을 준비할 시간을 확보하도록 하고, 계약실적도 정기적으로 공개해 투명성을 높일 방침이다. 지난해 충북도의 수의계약 가운데 지역업체 계약 비중은 84.7%였으며, 앞으로 지역 생산제품 구매와 지역업체 참여 확대에도 힘을 싣는다.</p>
