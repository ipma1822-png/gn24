<h1>IAEA “북한 영변 새 우라늄 농축시설, 최대 28개 원심분리 설비 수용 가능”</h1>
<p>북한이 영변 핵시설 단지에 새로 건설한 우라늄 농축시설이 최대 28개의 원심분리기 캐스케이드를 수용할 수 있는 규모인 것으로 국제원자력기구(IAEA)가 분석했다. IAEA는 북한이 지난 6월 공개한 내부 사진과 위성사진 등을 분석해 해당 건물을 영변의 새로운 우라늄 농축시설로 식별했다. 평양 인근 강선 농축시설에서도 생산 능력을 확대하는 움직임이 관측돼 북한이 여러 지역에서 동시에 우라늄 농</p>
