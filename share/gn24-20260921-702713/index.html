<h1>세계 외교의 시선 뉴욕으로…유엔총회, 전쟁·AI·한반도 평화 해법 논의</h1>
<p>세계 정상들이 제81차 유엔총회 고위급 주간을 앞두고 미국 뉴욕에 집결하고 있다. 올해 유엔총회에서는 중동과 우크라이나를 비롯한 국제분쟁과 안보, 인공지능(AI)의 급속한 발전에 따른 국제적 대응, 기후위기와 지속가능발전 등이 주요 현안으로 다뤄진다. 이재명 대통령도 유엔총회에 참석해 한반도 평화와 공존에 관한 한국의 구상을 국제사회에 제시할 예정이다.</p>
