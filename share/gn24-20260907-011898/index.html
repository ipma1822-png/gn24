<h1>정원 파다가 ‘1000년 전 보물’ 나왔다…덴마크서 바이킹 은 유물 18.5㎏ 발견</h1>
<p>덴마크의 한 주택 정원에서 약 1000년 전 바이킹 시대에 묻힌 것으로 추정되는 대규모 은 보물이 발견됐다. 전체 무게는 약 18.5㎏으로 은괴와 장신구, 주화 등 약 700점의 유물과 파편이 포함됐다. 특히 잉글랜드에서 만들어진 은화와 아랍권의 디르함이 함께 발견돼 당시 바이킹 사회가 유럽을 넘어 이슬람권까지 연결된 광범위한 교역망을 형성했다는 사실을 보여주는 중요한 고고학 자료로 평가된다</p>
