<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>대전 소식 본사 게시 | GLOBAL NEWS24</title><style>body{margin:0;background:#f4f6f9;color:#182235;font-family:system-ui,sans-serif}.wrap{max-width:720px;margin:30px auto;padding:20px;background:white;border-radius:14px}label{display:block;margin:16px 0;font-weight:700}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b7c2d0;border-radius:8px;font:inherit}button{padding:12px 20px;background:#143e72;color:white;border:0;border-radius:8px}p{line-height:1.7}</style></head><body><main class="wrap"><a href="/pages/admin-local-tips/?community=daejeon">← 대전 소식 검토함</a><h1>본사 최종 게시</h1><p>대전 지역에서 채택된 소식만 본사 관리자가 게시할 수 있습니다. 제출자의 연락처나 제3자 개인정보를 공개 문구에 복사하지 마세요.</p><form id="communityPublishForm"><label>채택된 접수 UUID<input name="submission_id" required maxlength="36" placeholder="접수 상세의 UUID"></label><label>분류<select name="category" required><option>경조사</option><option>행사 소식</option><option>인물 동정</option><option>개업·이전</option><option>단체 소식</option><option>지역 알림</option></select></label><label>공개 제목<input name="title" required minlength="2" maxlength="160"></label><label>공개 본문<textarea name="body" rows="8" required minlength="20" maxlength="5000"></textarea></label><button type="submit">본사 최종 게시</button><p id="communityPublishMessage" role="status"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/gn24-supabase-config.js"></script><script src="/assets/js/daejeon-community-hq.js"></script></body></html>
