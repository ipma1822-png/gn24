<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">GLOBAL NEWS24 Gold Emblem</title>
<desc id="desc">Official SHOWROOM gold camera and globe emblem</desc>
<defs>
  <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="1 0 0 0 .16  0 .75 0 0 .08  0 0 .15 0 0  0 0 0 .24 0" result="gold"/>
    <feMerge><feMergeNode in="gold"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="900" height="600" fill="#03070d"/>
<image href="https://news24.ai.kr/assets/images/logos/gn24-showroom-logo.jpg?v=122" x="0" y="0" width="900" height="600" preserveAspectRatio="xMidYMid meet" filter="url(#goldGlow)"/>
</svg>