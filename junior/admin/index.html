<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>꿈나무 기자단 승인센터 | GN24 JUNIOR PRESS</title>
  <style>
    :root{--navy:#07182f;--blue:#1269c7;--sky:#eaf6ff;--gold:#e8b742;--ink:#132238;--muted:#607087;--line:#dce6f0;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(920px,calc(100% - 28px));margin:auto}.top{background:var(--navy);color:#fff;padding:28px 0}.top small{color:#a9d8ff;font-weight:900;letter-spacing:.1em}.top h1{margin:5px 0 0;font-size:clamp(1.7rem,5vw,2.5rem)}main{padding:32px 0 60px}.panel,.card{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(7,24,47,.08)}.panel{padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.head h2{margin:0}.count{background:var(--sky);color:#154675;border-radius:999px;padding:5px 10px;font-weight:900}.list{display:grid;gap:14px}.card{padding:20px}.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:14px 0}.row span{display:block;color:var(--muted);font-size:.85rem}.row b{display:block;margin-top:2px}.status{color:#8a6200}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{min-height:46px;border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:#fff;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.btn.verify{background:#7a5600}.message{margin-top:12px;font-weight:800}.guard{padding:24px;text-align:center}.guard a{color:var(--blue);font-weight:900}.success{background:#effaf2;border:1px solid #b8dfc2;border-radius:14px;padding:18px}.success h3{margin:0 0 12px;color:#176335}.empty{padding:24px;text-align:center;color:var(--muted)}.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.tabs a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.tabs .btn{white-space:nowrap}.tabs .btn{flex:1;background:#334155}.tabs .btn.active{background:var(--blue)}.review p{white-space:pre-wrap}.review .meta{color:var(--muted);font-size:.9rem}.review h3{margin:0 0 8px}button:focus-visible,a:focus-visible{outline:3px solid #78bfff;outline-offset:2px}@media(max-width:580px){.rows{grid-template-columns:1fr}.head{align-items:flex-start}.actions,.btn{width:100%}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><small>GN24 JUNIOR PRESS</small><h1>꿈나무 기자단 승인센터</h1></div></header>
  <main class="wrap">
    <section id="guard" class="panel guard">관리자 권한을 확인하는 중입니다.</section>
    <section id="center" class="panel" hidden>
      <div class="tabs"><button id="tabApplicants" class="btn active" type="button">기자 승인</button><button id="tabReviews" class="btn" type="button">뉴스 검토</button><button id="tabReporters" class="btn" type="button">기자 목록</button><button id="tabPins" class="btn" type="button">PIN 재설정</button></div>
      <div class="tabs"><a class="btn" href="/junior/">꿈나무 기자단 홈</a><a class="btn" href="/">GN24 본부 메인</a></div>
      <div id="applicantsPane"><div class="head"><h2>승인 대기</h2><span id="count" class="count">0명</span></div><div id="list" class="list"></div></div>
      <div id="reportersPane" hidden><div class="head"><h2>기자 목록</h2><span id="reporterCount" class="count">0명</span></div><div id="reporterList" class="list"></div></div>
      <div id="reviewsPane" hidden><div class="head"><h2>주니어 뉴스 검토함</h2><span id="reviewCount" class="count">0건</span></div><div id="reviewList" class="list"></div></div><div id="pinsPane" hidden><div class="head"><h2>🔐 기자 PIN 재설정</h2><span class="count">관리자 전용</span></div><p>기존 PIN은 조회할 수 없습니다. 새 임시 PIN 발급 즉시 기존 로그인은 모두 종료됩니다.</p><div id="pinList" class="list"></div></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/gn24-supabase-config.js"></script>
  <script>
    (()=>{'use strict';
      const cfg=window.GN24_SUPABASE||{},base=String(cfg.url||'').replace(/\/$/,''),key=String(cfg.anonKey||''),guard=document.getElementById('guard'),center=document.getElementById('center'),list=document.getElementById('list'),count=document.getElementById('count');
      const sb=(cfg.url&&cfg.anonKey&&window.supabase)?window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{storage:window.localStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const date=v=>v?new Date(v).toLocaleDateString('ko-KR'):'-';
      async function request(path,options={}){const {data,error}=await sb.auth.getSession();if(error||!data.session)throw error||new Error('관리자 세션이 만료되었습니다.');const response=await fetch(base+path,{...options,headers:{apikey:key,Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json',...(options.headers||{})}});if(!response.ok)throw new Error(await response.text()||'요청 실패');return response.status===204?null:response.json()}
      const rpc=(name,body={})=>request('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(body)});
      function deny(message){center.hidden=true;guard.hidden=false;guard.innerHTML=message}
      function card(row){return `<article class="card" data-id="${row.internal_id}"><h3>${esc(row.nickname)}</h3><div class="rows"><div class="row"><span>실명</span><b>${esc(row.real_name)}</b></div><div class="row"><span>공개 닉네임</span><b>${esc(row.nickname)}</b></div><div class="row"><span>신청일</span><b>${esc(date(row.applied_at))}</b></div><div class="row"><span>보호자 동의 상태</span><b class="status">${esc(row.guardian_consent_status)}</b></div></div><div class="actions">${row.guardian_consent_status==='VERIFIED'?`<button class="btn approve" type="button">기자 승인</button>`:`<button class="btn verify" type="button">보호자 동의 확인</button>`}</div><div class="message" role="status" aria-live="polite"></div></article>`}
      async function load(){const rows=await request('/rest/v1/gn24_junior_reporters?select=internal_id,real_name,nickname,applied_at,guardian_consent_status,reporter_id,status&status=eq.PENDING&order=applied_at.asc');count.textContent=`${rows.length}명`;list.innerHTML=rows.map(card).join('')||'<div class="empty">현재 승인 대기 신청자가 없습니다.</div>';list.querySelectorAll('.verify').forEach(button=>button.onclick=()=>verify(button));list.querySelectorAll('.approve').forEach(button=>button.onclick=()=>approve(button))}
      async function loadReporters(){const box=document.getElementById('reporterList'),rc=document.getElementById('reporterCount');box.innerHTML='<div class="empty">불러오는 중…</div>';try{const rows=await request('/rest/v1/gn24_junior_reporters?select=internal_id,real_name,nickname,status,applied_at&order=applied_at.desc');let totals={};try{const submissions=await request('/rest/v1/gn24_junior_submissions?select=junior_reporter_internal_id,status&status=eq.PUBLISHED');submissions.forEach(x=>{totals[x.junior_reporter_internal_id]=(totals[x.junior_reporter_internal_id]||0)+1})}catch(e){console.warn('GN24 Junior article counts',e);totals=null}rc.textContent=rows.length+'명';box.innerHTML=rows.map(r=>'<article class="card"><h3>'+esc(r.nickname)+'</h3><div class="rows"><div class="row"><span>이름</span><b>'+esc(r.real_name)+'</b></div><div class="row"><span>닉네임</span><b>'+esc(r.nickname)+'</b></div><div class="row"><span>상태</span><b>'+esc(r.status)+'</b></div><div class="row"><span>신청일</span><b>'+esc(date(r.applied_at))+'</b></div>'+(totals?'<div class="row"><span>발행 기사</span><b>'+esc(totals[r.internal_id]||0)+'건</b></div>':'')+'</div></article>').join('')||'<div class="empty">등록된 기자가 없습니다.</div>'}catch(e){console.warn('GN24 Junior reporters',e);box.innerHTML='<div class="empty">기자 목록을 불러오지 못했습니다.</div>'}}
      async function loadPins(){const box=document.getElementById('pinList');box.innerHTML='<div class="empty">불러오는 중…</div>';try{const rows=await request('/rest/v1/gn24_junior_reporters?select=internal_id,nickname,reporter_id,status&status=eq.ACTIVE&order=reporter_id.asc');box.innerHTML=rows.map(r=>'<article class="card"><h3>'+esc(r.nickname)+'</h3><div class="rows"><div class="row"><span>기자번호</span><b>'+esc(r.reporter_id)+'</b></div><div class="row"><span>상태</span><b>ACTIVE</b></div></div><div class="actions"><input id="pin-'+r.internal_id+'" inputmode="numeric" maxlength="4" type="password" placeholder="새 임시 PIN 4자리" style="min-height:46px;padding:10px;border:1px solid #cbd5e1;border-radius:10px"><button class="btn" type="button" data-reset="'+r.internal_id+'">임시 PIN 발급</button></div><div id="pinmsg-'+r.internal_id+'" class="message"></div></article>').join('');box.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetPin(Number(b.dataset.reset),b))}catch(e){box.innerHTML='<div class="empty">기자 목록을 불러오지 못했습니다.</div>'}}
async function resetPin(id,button){const input=document.getElementById('pin-'+id),pin=input.value.trim(),msg=document.getElementById('pinmsg-'+id);if(!/^\\d{4}$/.test(pin)){msg.textContent='숫자 4자리를 입력하세요.';return}if(!confirm('새 임시 PIN을 발급할까요? 기존 로그인은 모두 종료됩니다.'))return;button.disabled=true;try{await rpc('gn24_admin_reset_junior_pin',{p_internal_id:id,p_new_pin:pin});msg.innerHTML='<span style="color:#176335">재설정 완료. 임시 PIN을 보호자에게 안전하게 전달하세요. 이후에는 다시 조회할 수 없습니다.</span>';input.value=''}catch(e){msg.textContent='PIN 재설정에 실패했습니다.'}finally{button.disabled=false}}
async function loadReviews(){const box=document.getElementById('reviewList'),rc=document.getElementById('reviewCount');box.innerHTML='<div class="empty">불러오는 중…</div>';try{const rows=await request('/rest/v1/gn24_junior_submissions?select=id,title,what_happened,interview_note,feeling,status,submitted_at,junior_reporter_internal_id&status=in.(SUBMITTED,REVIEWING)&order=submitted_at.asc');rc.textContent=rows.length+'건';if(!rows.length){box.innerHTML='<div class="empty">검토할 뉴스가 없습니다.</div>';return}const reporters=await request('/rest/v1/gn24_junior_reporters?select=internal_id,nickname,reporter_id');const rm=Object.fromEntries(reporters.map(r=>[r.internal_id,r]));box.innerHTML=rows.map(x=>{const r=rm[x.junior_reporter_internal_id]||{};return '<article class="card review"><h3>'+esc(x.title)+'</h3><div class="meta">'+esc(r.nickname||'')+' · '+esc(r.reporter_id||'')+' · '+new Date(x.submitted_at).toLocaleString('ko-KR')+'</div><p><b>무슨 일이 있었나요?</b><br>'+esc(x.what_happened)+'</p>'+(x.interview_note?'<p><b>질문·인터뷰</b><br>'+esc(x.interview_note)+'</p>':'')+(x.feeling?'<p><b>느낀 점</b><br>'+esc(x.feeling)+'</p>':'')+'<div class="actions"><button class="btn" type="button" onclick="window.gn24StartReview('+x.id+',this)">'+(x.status==='REVIEWING'?'편집 중':'편집 시작')+'</button><button class="btn" type="button" onclick="window.gn24SendEditor('+x.id+')">기사 편집실로 보내기</button></div></article>'}).join('')}catch(e){console.warn('GN24 Junior reviews',e);box.innerHTML='<div class="empty">뉴스를 불러오지 못했습니다.</div>'}}
      window.gn24SendEditor=async(id)=>{try{const rows=await request('/rest/v1/gn24_junior_submissions?select=id,title,what_happened,interview_note,feeling,junior_reporter_internal_id&id=eq.'+id);if(!rows?.[0])throw new Error('원고 없음');const x=rows[0],reporters=await request('/rest/v1/gn24_junior_reporters?select=internal_id,nickname,reporter_id&internal_id=eq.'+x.junior_reporter_internal_id),r=reporters?.[0]||{};localStorage.setItem('gn24-junior-editor-bridge',JSON.stringify({submissionId:x.id,title:x.title,whatHappened:x.what_happened,interviewNote:x.interview_note||'',feeling:x.feeling||'',nickname:r.nickname||'',reporterId:r.reporter_id||''}));await request('/rest/v1/gn24_junior_submissions?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'REVIEWING',reviewed_at:new Date().toISOString()})});location.href='/admin-news.html?junior='+id}catch(e){alert('기사 편집실로 보내지 못했습니다.')}}
      window.gn24StartReview=async(id,button)=>{button.disabled=true;try{await request('/rest/v1/gn24_junior_submissions?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'REVIEWING',reviewed_at:new Date().toISOString()})});button.textContent='편집 중'}catch(e){button.disabled=false;alert('상태를 변경하지 못했습니다.')}}
      function showTab(name){['applicants','reviews','reporters','pins'].forEach(tab=>{document.getElementById(tab+'Pane').hidden=tab!==name;document.getElementById('tab'+tab[0].toUpperCase()+tab.slice(1)).classList.toggle('active',tab===name)});if(name==='reviews')loadReviews();if(name==='reporters')loadReporters();if(name==='pins')loadPins()}
      async function verify(button){const card=button.closest('.card'),message=card.querySelector('.message');button.disabled=true;message.textContent='처리 중…';try{await rpc('gn24_admin_verify_junior_consent',{p_internal_id:Number(card.dataset.id),p_consent_version:'GN24-JUNIOR-V1',p_identifiable_photo_consent:false});await load()}catch(error){message.textContent='처리하지 못했습니다.';button.disabled=false}}
      async function approve(button){const card=button.closest('.card'),message=card.querySelector('.message'),nickname=card.querySelector('h3').textContent;button.disabled=true;message.textContent='처리 중…';try{const reporterId=await rpc('gn24_admin_approve_junior_reporter',{p_internal_id:Number(card.dataset.id)});card.innerHTML=`<div class="success"><h3>🎉 승인 완료</h3><div class="rows"><div class="row"><span>닉네임</span><b>${esc(nickname)}</b></div><div class="row"><span>발급된 기자 활동번호</span><b>${esc(reporterId)}</b></div><div class="row"><span>상태</span><b>ACTIVE</b></div></div></div>`;count.textContent=`${Math.max(0,Number.parseInt(count.textContent,10)-1)}명`}catch(error){message.textContent='승인하지 못했습니다.';button.disabled=false}}
      async function adminLogin(){if(!sb)return;const email=prompt('Global News24 관리자 이메일');if(!email)return;deny('관리자 로그인 링크를 보내는 중입니다…');const {error}=await sb.auth.signInWithOtp({email:email.trim(),options:{emailRedirectTo:'https://news24.ai.kr/junior/admin/',shouldCreateUser:false}});if(error){deny('로그인 링크 발송 실패: '+esc(error.message));return}deny('관리자 이메일로 로그인 링크를 보냈습니다.<br>Gmail에서 방금 받은 링크를 눌러주세요.');}
      document.addEventListener('DOMContentLoaded',async()=>{if(!sb){deny('관리자 인증 설정을 불러올 수 없습니다.');return}try{const {data}=await sb.auth.getSession();if(!data.session){deny('본사 관리자 로그인이 필요합니다.<br><button id="juniorAdminLogin" type="button">이메일로 관리자 로그인</button>');document.getElementById('juniorAdminLogin')?.addEventListener('click',adminLogin);return}const {data:admin,error}=await sb.rpc('is_gn24_admin');if(error||admin!==true){deny('GN24 대표·관리자 권한이 필요합니다.');return}guard.hidden=true;center.hidden=false;['Applicants','Reviews','Reporters','Pins'].forEach(name=>{document.getElementById('tab'+name).onclick=()=>showTab(name.toLowerCase())});await load()}catch(error){deny('관리자 권한을 확인할 수 없습니다.')} });
    })();
  </script>
</body>
</html>
