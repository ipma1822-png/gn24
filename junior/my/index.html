<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>나의 기자단 | GN24 JUNIOR PRESS</title><style>:root{--navy:#07182f;--blue:#1269c7;--gold:#e8b742;--line:#dce6f0;--muted:#5c6b7e}*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:#132238;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.top{background:var(--navy);color:#fff;padding:24px}.wrap{width:min(760px,calc(100% - 28px));margin:auto}.ey{color:#8ecbff;font-weight:900;letter-spacing:.1em}.top h1{margin:5px 0;font-size:2rem}.main{padding:28px 0 60px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 8px 24px rgba(7,24,47,.07)}.hello{font-size:1.55rem;font-weight:900;margin:0 0 6px}.muted{color:var(--muted)}.id{font-weight:900;color:var(--blue);font-size:1.2rem}.mission{background:#eaf6ff}.badge{display:inline-block;padding:8px 11px;border-radius:999px;background:#fff3c9;margin:5px 5px 0 0;font-weight:800}.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:var(--blue);color:#fff;font-weight:900;font-size:1rem}.logout{background:#fff;color:#24364b;border:1px solid #aebdcc;margin-top:12px}.status{text-align:center;padding:30px;font-weight:800}@media(max-width:520px){.top h1{font-size:1.7rem}.card{padding:20px}}</style></head><body><header class="top"><div class="wrap"><div class="ey">GN24 JUNIOR PRESS</div><h1>나의 기자단</h1></div></header><main class="main"><div class="wrap" id="app"><div class="card status">기자 정보를 확인하고 있습니다…</div></div></main><script>const KEY='gn24-junior-session',base='https://plqqowwdbgixtczzyanr.supabase.co/functions/v1/';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function out(h){document.getElementById('app').innerHTML=h}function logout(){localStorage.removeItem(KEY);location.href='/junior/#entry'}async function load(){const token=localStorage.getItem(KEY);if(!token){location.replace('/junior/#entry');return}try{const res=await fetch(base+'gn24-junior-me',{headers:{Authorization:'Bearer '+token}}),d=await res.json();if(!res.ok||!d.ok){localStorage.removeItem(KEY);location.replace('/junior/#entry');return}const r=d.reporter,b=(d.badges||[]).map(x=>'<span class="badge">★ '+esc(x.badge_code.replaceAll('_',' '))+'</span>').join('')||'<span class="muted">첫 활동을 시작하면 성장 배지가 하나씩 기록됩니다.</span>';out('<section class="card"><p class="hello">'+esc(r.nickname)+' 기자님, 반가워요! 👋</p><p class="muted">GLOBAL NEWS24 꿈나무 기자단</p><p>기자 활동번호<br><span class="id">'+esc(r.reporterId)+'</span></p></section><section class="card mission"><strong>📰 이번 기자 미션</strong><h2>나의 첫 뉴스</h2><p>오늘 내가 발견한 이야기 하나를 보고, 질문하고, 기록해 보세요.</p></section><section class="card"><strong>⭐ 나의 기자배지</strong><div>'+b+'</div></section><section class="card"><strong>🛡️ 안전한 기자활동</strong><p class="muted">어린이가 기사를 직접 발행하지 않습니다. 작성한 이야기는 GN24 편집부의 확인을 거쳐 뉴스가 됩니다.</p><button class="btn" onclick="location.href=\'/junior/#challenge\'">첫 뉴스 미션 보기</button><button class="btn logout" onclick="logout()">기자단 나가기</button></section>')}catch{out('<section class="card status">잠시 후 다시 시도해 주세요.</section>')}}load();</script></body></html>
