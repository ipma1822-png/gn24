xtarea{min-height:110px;resize:vertical}.ok{background:#edf9ef;border:1px solid #9ed2a5;border-radius:12px;padding:15px;font-weight:800}.status{text-align:center;padding:30px;font-weight:800}@media(max-width:520px){.top h1{font-size:1.7rem}.card{padding:20px}}</style></head><body><header class="top"><div class="wrap"><div class="ey">GN24 JUNIOR PRESS</div><h1>나의 기자단</h1></div></header><main class="main"><div class="wrap" id="app"><div class="card status">기자 정보를 확인하고 있습니다…</div></div></main><script>const KEY='gn24-junior-session',base='https://plqqowwdbgixtczzyanr.supabase.co/functions/v1/';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function out(h){document.getElementById('app').innerHTML=h}function logout(){localStorage.removeItem(KEY);location.href='/junior/#entry'}function openNews(){const x=document.getElementById('newsform');x.classList.add('show');x.scrollIntoView({behavior:'smooth'})}async function submitNews(e){e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{const res=await fetch(base+'gn24-junior-submit',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem(KEY)},body:JSON.stringify({title:f.title.value,whatHappened:f.what.value,interviewNote:f.interview.value,feeling:f.feeling.value})}),d=await res.json();if(!res.ok){alert(d.error||'제출하지 못했습니다.');return}f.parentElement.innerHTML='<div class="ok">🎉 첫 뉴스가 GN24 편집부에 제출되었습니다.<br>확인 후 소중한 뉴스로 다듬겠습니다.</div>'}catch{alert('잠시 후 다시 시도해 주세요.')}finally{b.disabled=false}}async function load(){const token=localStorage.getItem(KEY);if(!token){location.replace('/junior/#entry');return}try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000),res=await fetch(base+'gn24-junior-me',{headers:{Authorization:'Bearer '+token},signal:controller.signal});clearTimeout(timer);const d=await res.json();if(!res.ok||!d.ok){localStorage.removeItem(KEY);location.replace('/junior/#entry');return}const r=d.reporter,b=(d.badges||[]).map(x=>'<span class="badge">★ '+esc(x.badge_code.replaceAll('_',' '))+'</span>').join('')||'<span class="muted">첫 활동을 시작하면 성장 배지가 하나씩 기록됩니다.</span>';out('<section class="card"><p class="hello">'+esc(r.nickname)+' 기자님, 반가워요! 👋</p><p class="muted">GLOBAL NEWS24 꿈나무 기자단</p><p>기자 활동번호<br><span class="id">'+esc(r.reporterId)+'</span></p></section><section class="card mission" role="button" tabindex="0" onclick="openNews()" style="cursor:pointer"><strong>📰 이번 기자 미션</strong><h2>나의 첫 뉴스</h2><p>오늘 내가 발견한 이야기 하나를 보고, 질문하고, 기록해 보세요.</p><p><strong>📝 눌러서 첫 뉴스 작성하기 →</strong></p></section><section class="card"><strong>⭐ 나의 기자배지</strong><div>'+b+'</div></section><section class="card"><strong>🛡️ 안전한 기자활동</strong><p class="muted">어린이가 기사를 직접 발행하지 않습니다. 작성한 이야기는 GN24 편집부의 확인을 거쳐 뉴스가 됩니다.</p><button class="btn" onclick="openNews()">📝 첫 뉴스 작성하기</button><button class="btn logout" onclick="logout()">기자단 나가기</button></section><section class="card newsform" id="newsform"><strong>📝 첫 뉴스 제출</strong><p class="muted">편하게 작성하세요. 바로 공개되지 않고 GN24 편집부가 먼저 확인합니다.</p><form id="firstNews"><div class="field"><label>뉴스 제목</label><input name="title" maxlength="120" required></div><div class="field"><label>무슨 일이 있었나요?</label><textarea name="what" maxlength="2000" required></textarea></div><div class="field"><label>누구에게 무엇을 물어봤나요? <span class="muted">(선택)</span></label><textarea name="interview" maxlength="2000"></textarea></div><div class="field"><label>나는 어떻게 느꼈나요? <span class="muted">(선택)</span></label><textarea name="feeling" maxlength="2000"></textarea></div><button class="btn" type="submit">GN24 편집부에 제출하기</button></form></section>');document.getElementById('firstNews').addEventListener('submit',submitNews)}catch{out('<section class="card status">기자 정보를 불러오지 못했습니다.<br><br><button class="btn" onclick="location.reload()">다시 불러오기</button><button class="btn logout" onclick="logout()">다시 로그인하기</button></section>')}}load();</script></body></html>
