ont-weight:900;font:inherit;cursor:pointer}.mission-choice small{display:block;color:#667085;font-weight:600;margin-top:5px;line-height:1.35}.mission-choice.active{outline:3px solid #79c9ff;background:#edf8ff}.mission-note{margin-top:12px;padding:12px;border-radius:12px;background:#f4f8fb;color:#425466;font-size:.9rem}.status{text-align:center;padding:30px;font-weight:800}@media(max-width:420px){.mission-grid{grid-template-columns:1fr}}@media(max-width:520px){.top h1{font-size:1.7rem}.card{padding:20px}}</style></head><body><header class="top"><div class="wrap"><div class="ey">GN24 JUNIOR PRESS</div><h1>나의 기자실</h1></div></header><main class="main"><div class="wrap" id="app"><div class="card status">기자 정보를 확인하고 있습니다…</div></div></main><script>const KEY='gn24-junior-session',base='https://plqqowwdbgixtczzyanr.supabase.co/functions/v1/';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function out(h){document.getElementById('app').innerHTML=h}function logout(){localStorage.removeItem(KEY);location.href='/junior/#entry'}function openNews(type){const x=document.getElementById('newsform');x.classList.add('show');if(type){const map={challenge:['나의 도전','오늘 새롭게 도전했거나 끝까지 해낸 일을 기록해 보세요.'],interview:['친구 인터뷰','친구에게 궁금한 것을 물어보고 기억에 남는 답을 적어 보세요.'],community:['우리동네','우리 주변에서 발견한 좋은 일이나 바뀐 모습을 알려 주세요.'],dream:['나의 꿈','내가 좋아하는 것과 앞으로 이루고 싶은 꿈을 뉴스처럼 써 보세요.'],good:['칭찬뉴스','고맙거나 멋진 친구·가족·선생님의 이야기를 찾아보세요.'],kids:['어린이뉴스','내가 직접 발견한 재미있고 중요한 소식을 기록해 보세요.']};const v=map[type];if(v){x.querySelector('.form-mission').textContent='🎯 '+v[0];x.querySelector('.form-guide').textContent=v[1];document.querySelectorAll('.mission-choice').forEach(b=>b.classList.toggle('active',b.dataset.mission===type));}}x.scrollIntoView({behavior:'smooth'})}async function submitNews(e){e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{const res=await fetch(base+'gn24-junior-submit',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem(KEY)},body:JSON.stringify({title:f.title.value,whatHappened:f.what.value,interviewNote:f.interview.value,feeling:f.feeling.value})}),d=await res.json();if(!res.ok){alert(d.error||'제출하지 못했습니다.');return}f.parentElement.innerHTML='<div class="ok">🎉 첫 뉴스가 GN24 편집부에 제출되었습니다.<br>확인 후 소중한 뉴스로 다듬겠습니다.</div>'}catch{alert('잠시 후 다시 시도해 주세요.')}finally{b.disabled=false}}async function load(){const token=localStorage.getItem(KEY);if(!token){location.replace('/junior/#entry');return}try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000),res=await fetch(base+'gn24-junior-me',{headers:{Authorization:'Bearer '+token},signal:controller.signal});clearTimeout(timer);const d=await res.json();if(!res.ok||!d.ok){localStorage.removeItem(KEY);location.replace('/junior/#entry');return}const r=d.reporter;const subs=d.submissions||[];const statusNames={SUBMITTED:'📨 편집부 확인 중',REVIEWING:'✍️ 편집 중',PUBLISHED:'🎉 발행 완료',RETURNED:'💬 다시 살펴보기'};const activity=subs.length?subs.map(x=>'<div class="activity-item">'+(x.article&&x.article.image?'<img class="activity-thumb" src="'+esc(x.article.image)+'" alt="">':'')+'<div class="activity-title">'+esc(x.title)+'</div><div class="activity-meta">'+new Date(x.submitted_at).toLocaleDateString('ko-KR')+'</div><span class="activity-state '+(x.status==='PUBLISHED'?'published':'')+'">'+esc(statusNames[x.status]||x.status)+'</span>'+(x.status==='PUBLISHED'&&x.related_article_id?'<br><a class="activity-link" href="/pages/article/?id='+encodeURIComponent(x.related_article_id)+'">📰 내 뉴스 보러가기 →</a>':'')+'</div>').join(''):'<p class="muted">아직 제출한 뉴스가 없어요. 첫 발견을 뉴스로 기록해 보세요!</p>';const publishedCount=subs.filter(x=>x.status==='PUBLISHED').length;const badgeNames={FIRST_ARTICLE:'🏅 첫 기사',FIRST_INTERVIEW:'🎤 첫 인터뷰',GOOD_FRIEND:'🤝 좋은 친구',COMMUNITY_REPORTER:'🏘 우리동네 기자',MY_DREAM:'🌈 나의 꿈',CHALLENGER:'🚀 도전 기자','5_ARTICLES':'📰 기사 5개','10_ARTICLES':'🏆 기사 10개'};const b=(d.ba ng><div>'+b+'</div></section><section class="card"><strong>🛡️ 안전한 기자활동</strong><p class="muted">어린이가 기사를 직접 발행하지 않습니다. 작성한 이야기는 GN24 편집부의 확인을 거쳐 뉴스가 됩니다.</p><button class="btn" onclick="openNews()">📝 첫 뉴스 작성하기</button><button class="btn logout" onclick="logout()">기자단 나가기</button></section><section class="card newsform" id="newsform"><strong>📝 새 뉴스 작성</strong><h2 class="form-mission">🎯 자유 취재</h2><p class="muted form-guide">천천히 생각하며 써 보세요. 바로 공개되지 않고 GN24 편집부가 먼저 확인합니다.</p><form id="firstNews"><div class="field"><label>⑤ 제목을 붙여볼까요?</label><input name="title" maxlength="120" required></div><div class="field"><label>① 무슨 일이 있었나요?</label><textarea name="what" maxlength="2000" required></textarea></div><div class="field"><label>② 누구에게 무엇을 물어봤나요? <span class="muted">(선택)</span></label><textarea name="interview" maxlength="2000"></textarea></div><div class="field"><label>④ 나는 무엇을 느꼈나요? <span class="muted">(선택)</span></label><textarea name="feeling" maxlength="2000"></textarea></div><button class="btn" type="submit">📨 GN24 편집부에 보내기</button></form></section>');document.getElementById('firstNews').addEventListener('submit',submitNews)}catch{out('<section class="card status">기자 정보를 불러오지 못했습니다.<br><br><button class="btn" onclick="location.reload()">다시 불러오기</button><button class="btn logout" onclick="logout()">다시 로그인하기</button></section>')}}load();</script></body></html>
